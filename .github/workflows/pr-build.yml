name: pr-build

on:
  pull_request:
    branches: [main]

concurrency:
  group: pr-build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      # full history so nx can diff against origin/main
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # toolchain, caches and pnpm install
      - uses: ./.github/actions/setup

      # prettier over the whole repo (Go is formatted by golangci-lint)
      - run: pnpm format:check

      # lint, build and test (each depends on generate, build also on its
      # dependencies' build), only for projects the PR affects
      - run: pnpm affected
