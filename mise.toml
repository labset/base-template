[settings]
disable_backends = ["asdf", "vfox"]
enable_tools = [
  "air",
  "atlas",
  "buf",
  "go",
  "golangci-lint",
  "node",
  "pnpm",
  "protoc-gen-connect-go",
  "protoc-gen-go",
  "sqlc",

  "npm:@bufbuild/protoc-gen-es",
  "npm:@fission-ai/openspec",
]

# Codegen plugins (protoc-gen-*): keep each in step with the runtime library the
# generated code imports (connectrpc.com/connect and google.golang.org/protobuf
# in Go, @bufbuild/protobuf in product/advisor/sdks/web/package.json).
[tools]
air = "1.67.4"
atlas = "1.3.0"
buf = "1.75.0"
go = "1.27.2"
golangci-lint = "2.15.0"
node = "24.21.0"
pnpm = "12.16.1"
protoc-gen-connect-go = "1.21.1"
protoc-gen-go = "1.36.11"
sqlc = "1.31.1"

"npm:@bufbuild/protoc-gen-es" = "2.16.0"
"npm:@fission-ai/openspec" = "1.16.0"
